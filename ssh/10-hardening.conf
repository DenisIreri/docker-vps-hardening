# Drop-in for /etc/ssh/sshd_config.d/ (OpenSSH 8.2+).
# Before installing: make sure your own public key is in ~/.ssh/authorized_keys and
# keep your current session open. Test with `sshd -t`, then `systemctl reload ssh`.

# Keys only.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Root may log in with a key (for automation) but never with a password.
# Prefer `no` plus a sudo user if nothing needs root over SSH.
PermitRootLogin prohibit-password

# Less to attack.
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no

# Allow TCP forwarding so admin tools bound to 127.0.0.1 can be reached
# over an SSH tunnel instead of being exposed (see README).
AllowTcpForwarding local
